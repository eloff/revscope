[package]
name = "revscope-api"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
description = "The wire contract shared by the RevScope server and CLI."
publish = false

# Serde only. This crate is compiled into the server, and into a CLI that is
# meant to stay small, so nothing here should need a runtime or a database.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
