# Self-hosted RevScope with Postgres, and optionally Caddy for HTTPS.
# See "Run your own instance with Docker" in README.md.
#
#   cp docker.env.example .env    # then fill it in
#   docker compose up -d

name: revscope

services:
  revscope:
    build:
      context: .
      secrets:
        - maxmind_account_id
        - maxmind_license_key
    restart: unless-stopped
    # Every variable in .env reaches the backend, so any option from
    # revscope/.env.example can be set there.
    env_file: .env
    environment:
      DATABASE_URL: postgres://revscope:${POSTGRES_PASSWORD}@postgres:5432/revscope
      REVSCOPE_LISTEN: 0.0.0.0:4320
      # Only this machine and the caddy service can reach the backend, so the
      # header comes from a proxy you run.
      REVSCOPE_TRUST_X_FORWARDED_FOR: "true"
    ports:
      - 127.0.0.1:${REVSCOPE_PORT:-4320}:4320
    volumes:
      - revscope-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    # Leaves time to flush buffered events on shutdown.
    stop_grace_period: 30s

  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    restart: unless-stopped
    environment:
      POSTGRES_USER: revscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: revscope
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "revscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  # HTTPS on REVSCOPE_DOMAIN. Enabled by COMPOSE_PROFILES=caddy in .env.
  caddy:
    image: caddy:2.11.7@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    profiles: [caddy]
    restart: unless-stopped
    environment:
      REVSCOPE_DOMAIN: ${REVSCOPE_DOMAIN:-}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - revscope

secrets:
  maxmind_account_id:
    environment: MAXMIND_ACCOUNT_ID
  maxmind_license_key:
    environment: MAXMIND_LICENSE_KEY

volumes:
  revscope-data:
  postgres-data:
  caddy-data:
  caddy-config:
